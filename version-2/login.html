<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div id="loginScreen" class="bg-white rounded-2xl shadow-xl p-8">
                <!-- Logo -->
                <div class="flex justify-center mb-6">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center">
                        <span class="text-white font-bold text-2xl">P</span>
                    </div>
                </div>
                
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Welcome Back</h1>
                <p class="text-center text-gray-500 mb-8">Enter your PIN to continue</p>

                <!-- Employee ID Input -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter your ID" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-lg font-medium">
                </div>

                <!-- PIN Display -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">PIN</label>
                    <div class="flex justify-center space-x-3 mb-6">
                        <div class="w-14 h-14 border-2 border-gray-300 rounded-lg flex items-center justify-center">
                            <span id="pin1" class="text-2xl text-gray-800">•</span>
                        </div>
                        <div class="w-14 h-14 border-2 border-gray-300 rounded-lg flex items-center justify-center">
                            <span id="pin2" class="text-2xl text-gray-800">•</span>
                        </div>
                        <div class="w-14 h-14 border-2 border-gray-300 rounded-lg flex items-center justify-center">
                            <span id="pin3" class="text-2xl text-gray-800">•</span>
                        </div>
                        <div class="w-14 h-14 border-2 border-gray-300 rounded-lg flex items-center justify-center">
                            <span id="pin4" class="text-2xl text-gray-800">•</span>
                        </div>
                    </div>
                </div>

                <!-- Number Pad -->
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button onclick="addPin('1')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">1</button>
                    <button onclick="addPin('2')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">2</button>
                    <button onclick="addPin('3')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">3</button>
                    <button onclick="addPin('4')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">4</button>
                    <button onclick="addPin('5')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">5</button>
                    <button onclick="addPin('6')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">6</button>
                    <button onclick="addPin('7')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">7</button>
                    <button onclick="addPin('8')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">8</button>
                    <button onclick="addPin('9')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">9</button>
                    <button onclick="clearPin()" class="bg-red-100 hover:bg-red-200 active:bg-red-300 text-red-700 font-semibold py-4 rounded-lg transition text-sm">Clear</button>
                    <button onclick="addPin('0')" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition text-xl">0</button>
                    <button onclick="deletePin()" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-800 font-semibold py-4 rounded-lg transition">
                        <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"/>
                        </svg>
                    </button>
                </div>

                <!-- Login Button -->
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition mb-4">
                    Login
                </button>

                <!-- Footer -->
                <div class="text-center">
                    <button onclick="showAdminSetup()" class="text-sm text-blue-600 hover:text-blue-700">Need help? Contact admin</button>
                </div>
            </div>

            <!-- Admin Setup Card (Hidden by default) -->
            <div id="adminSetup" class="bg-white rounded-2xl shadow-xl p-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Admin Setup</h2>
                    <button onclick="showLogin()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <p class="text-gray-600 mb-6">Create new employee accounts for POS access</p>

                <!-- New Employee Form -->
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Employee Name</label>
                        <input type="text" placeholder="John Doe" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Employee ID</label>
                        <input type="text" placeholder="EMP001" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                        <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option>Cashier</option>
                            <option>Supervisor</option>
                            <option>Manager</option>
                            <option>Admin</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Set PIN (4 digits)</label>
                        <input type="password" maxlength="4" placeholder="••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-2xl tracking-widest">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm PIN</label>
                        <input type="password" maxlength="4" placeholder="••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-2xl tracking-widest">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-3">
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        Create Employee
                    </button>
                    <button onclick="showEmployeeList()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-lg transition">
                        View All Employees
                    </button>
                </div>
            </div>

            <!-- Employee List Card (Hidden by default) -->
            <div id="employeeList" class="bg-white rounded-2xl shadow-xl p-8 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Employee List</h2>
                    <button onclick="showAdminSetup()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Search -->
                <div class="mb-6">
                    <div class="relative">
                        <input type="text" placeholder="Search employees..." class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <!-- Employee Items -->
                <div class="space-y-3 mb-6 max-h-96 overflow-y-auto">
                    <!-- Employee Item -->
                    <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                <span class="text-blue-600 font-semibold">JD</span>
                            </div>
                            <div>
                                <h4 class="font-semibold text-gray-800">John Doe</h4>
                                <p class="text-sm text-gray-500">ID: EMP001 • Cashier</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </button>
                            <button class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                                <span class="text-green-600 font-semibold">SA</span>
                            </div>
                            <div>
                                <h4 class="font-semibold text-gray-800">Sarah Anderson</h4>
                                <p class="text-sm text-gray-500">ID: EMP002 • Supervisor</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </button>
                            <button class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                                <span class="text-purple-600 font-semibold">MJ</span>
                            </div>
                            <div>
                                <h4 class="font-semibold text-gray-800">Michael Johnson</h4>
                                <p class="text-sm text-gray-500">ID: EMP003 • Manager</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                </svg>
                            </button>
                            <button class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button onclick="showAdminSetup()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                    Add New Employee
                </button>
            </div>
        </div>
    </div>

    <script>
        let pin = '';

        function addPin(digit) {
            if (pin.length < 4) {
                pin += digit;
                updatePinDisplay();
            }
        }

        function deletePin() {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                updatePinDisplay();
            }
        }

        function clearPin() {
            pin = '';
            updatePinDisplay();
        }

        function updatePinDisplay() {
            for (let i = 1; i <= 4; i++) {
                const element = document.getElementById('pin' + i);
                if (i <= pin.length) {
                    element.textContent = '●';
                    element.parentElement.classList.add('border-blue-500', 'bg-blue-50');
                    element.parentElement.classList.remove('border-gray-300');
                } else {
                    element.textContent = '•';
                    element.parentElement.classList.remove('border-blue-500', 'bg-blue-50');
                    element.parentElement.classList.add('border-gray-300');
                }
            }
        }

        function login() {
            const employeeId = document.getElementById('employeeId').value;
            
            if (!employeeId) {
                alert('Please enter your Employee ID');
                return;
            }
            
            if (pin.length !== 4) {
                alert('Please enter your 4-digit PIN');
                return;
            }

            // Here you would validate against your backend
            alert('Login successful! Employee ID: ' + employeeId + ' PIN: ' + pin);
            
            // Reset
            clearPin();
            document.getElementById('employeeId').value = '';
        }

        function showAdminSetup() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminSetup').classList.remove('hidden');
            document.getElementById('employeeList').classList.add('hidden');
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminSetup').classList.add('hidden');
            document.getElementById('employeeList').classList.add('hidden');
        }

        function showEmployeeList() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminSetup').classList.add('hidden');
            document.getElementById('employeeList').classList.remove('hidden');
        }

        // Allow keyboard input for PIN
        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') {
                addPin(e.key);
            } else if (e.key === 'Backspace') {
                deletePin();
            } else if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
