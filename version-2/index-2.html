<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">P</span>
                    </div>
                    <h1 class="text-xl font-semibold text-gray-800">POS System</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 text-sm text-gray-600">
                    <span>Cashier:</span>
                    <span class="font-medium text-gray-800">John Doe</span>
                </div>
                <button class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex h-[calc(100vh-65px)]">
        <!-- Left Section - Products -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Search Bar -->
            <div class="bg-white p-4 border-b border-gray-200">
                <div class="relative">
                    <input type="text" placeholder="Search products..." class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- Categories -->
            <div class="bg-white px-4 py-3 border-b border-gray-200 overflow-x-auto">
                <div class="flex space-x-2 min-w-max">
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium whitespace-nowrap">All Products</button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition whitespace-nowrap">Electronics</button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition whitespace-nowrap">Clothing</button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition whitespace-nowrap">Food & Beverage</button>
                    <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition whitespace-nowrap">Home & Garden</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                    <!-- Product Card -->
                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center overflow-hidden">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Laptop Pro 15"</h3>
                        <p class="text-blue-600 font-semibold text-lg">$1,299.99</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Smartphone X</h3>
                        <p class="text-blue-600 font-semibold text-lg">$899.00</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Camera DSLR</h3>
                        <p class="text-blue-600 font-semibold text-lg">$749.99</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Webcam HD</h3>
                        <p class="text-blue-600 font-semibold text-lg">$129.99</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Microphone Pro</h3>
                        <p class="text-blue-600 font-semibold text-lg">$199.00</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Headphones</h3>
                        <p class="text-blue-600 font-semibold text-lg">$299.99</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Tablet 10"</h3>
                        <p class="text-blue-600 font-semibold text-lg">$449.00</p>
                    </button>

                    <button class="bg-white rounded-lg p-3 hover:shadow-lg transition-shadow border border-gray-200 text-left group">
                        <div class="aspect-square bg-gray-100 rounded-lg mb-2 flex items-center justify-center">
                            <div class="w-16 h-16 text-gray-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                        <h3 class="font-medium text-gray-800 text-sm mb-1 truncate">Smart Watch</h3>
                        <p class="text-blue-600 font-semibold text-lg">$349.99</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Section - Cart -->
        <div class="w-full md:w-96 lg:w-[420px] bg-white border-l border-gray-200 flex flex-col">
            <!-- Cart Header -->
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800">Current Order</h2>
                <p class="text-sm text-gray-500">Order #1234</p>
            </div>

            <!-- Cart Items -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="space-y-3">
                    <!-- Cart Item -->
                    <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                        <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0"></div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-800 text-sm truncate">Laptop Pro 15"</h4>
                            <p class="text-sm text-gray-500">$1,299.99</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 transition flex items-center justify-center">
                                <span class="text-gray-600 font-bold">-</span>
                            </button>
                            <span class="w-8 text-center font-medium text-gray-800">1</span>
                            <button class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 transition flex items-center justify-center">
                                <span class="text-gray-600 font-bold">+</span>
                            </button>
                        </div>
                        <button class="text-red-500 hover:text-red-700 transition p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>

                    <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                        <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0"></div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-800 text-sm truncate">Smartphone X</h4>
                            <p class="text-sm text-gray-500">$899.00</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 transition flex items-center justify-center">
                                <span class="text-gray-600 font-bold">-</span>
                            </button>
                            <span class="w-8 text-center font-medium text-gray-800">2</span>
                            <button class="w-7 h-7 bg-gray-200 rounded hover:bg-gray-300 transition flex items-center justify-center">
                                <span class="text-gray-600 font-bold">+</span>
                            </button>
                        </div>
                        <button class="text-red-500 hover:text-red-700 transition p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="border-t border-gray-200 p-4 space-y-3">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">Subtotal</span>
                    <span class="font-medium text-gray-800">$3,097.99</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">Tax (8%)</span>
                    <span class="font-medium text-gray-800">$247.84</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600">Discount</span>
                    <span class="font-medium text-green-600">-$0.00</span>
                </div>
                <div class="border-t border-gray-200 pt-3 flex justify-between">
                    <span class="font-semibold text-gray-800">Total</span>
                    <span class="font-bold text-xl text-gray-900">$3,345.83</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="p-4 space-y-2 border-t border-gray-200">
                <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Charge $3,345.83
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <button class="py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition text-sm">
                        Hold Order
                    </button>
                    <button class="py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition text-sm">
                        Clear Cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
